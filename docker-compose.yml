# ArchForge local infrastructure.
#
# Host ports are deliberately offset from the defaults (19092/15432/16379/17017)
# so this stack can coexist with other projects running on the same machine.
# Override any of them with an .env file next to this compose file.

name: archforge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: archforge-kafka
    ports:
      - "${KAFKA_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: archforge-kraft-01
      # Two PLAINTEXT listeners: one for in-network clients (kafka-init and the
      # service containers) and one advertised to the Docker host.
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker: replication factor must stay at 1 or topic creation fails.
      # The application-level replication factor (3) is applied by the topic
      # bootstrapper only when the cluster actually has 3 brokers.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 48
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: archforge-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/topics.conf:/app/topics.conf:ro
      - ./infrastructure/kafka/init-topics.sh:/app/init-topics.sh:ro
    environment:
      # Must use the in-network listener. Bootstrapping on the host listener
      # (kafka:9092) makes the broker hand back `localhost:19092` as the
      # advertised address, which is unroutable from another container.
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
    entrypoint: ["/bin/bash", "/app/init-topics.sh"]
    # Re-runnable on every `docker compose up`: init-topics.sh is idempotent and
    # applies any newly declared topic. Without this, adding a topic to topics.conf
    # requires manually recreating the container, and services fail at runtime with
    # UNKNOWN_TOPIC_OR_PARTITION — which is exactly how `submission.lifecycle` was
    # missing while the compiler was already publishing to it.
    restart: on-failure
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:pg16
    container_name: archforge-postgres
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archforge}
      POSTGRES_DB: ${POSTGRES_DB:-archforge}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archforge} -d ${POSTGRES_DB:-archforge}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  valkey:
    image: valkey/valkey:8.0.2
    container_name: archforge-valkey
    command: >
      valkey-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${VALKEY_PORT:-16379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  mongodb:
    image: mongo:7.0
    container_name: archforge-mongo
    ports:
      - "${MONGODB_PORT:-17017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-archforge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-archforge}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-archforge}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

volumes:
  kafka-data:
  postgres-data:
  valkey-data:
  mongo-data:
