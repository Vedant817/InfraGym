# ArchForge topic catalogue — single source of truth for `kafka-init`.
#
# Format:  name | partitions | replicationFactor | key=value[,key=value...]
# Blank lines and `#` comments are ignored.
#
# replicationFactor is 1 because the local compose stack runs a single broker.
# Production deployments run 3 brokers; the value below is then raised to 3 by
# infrastructure/kafka/init-topics-prod.sh or by the IaC layer.

# --- design ingestion -------------------------------------------------------
design.submissions              | 6  | 1 | cleanup.policy=delete,retention.ms=604800000
design.updates                  | 6  | 1 | cleanup.policy=compact,delete.retention.ms=86400000,min.cleanable.dirty.ratio=0.1,segment.ms=60000
submission.lifecycle            | 6  | 1 | cleanup.policy=delete,retention.ms=604800000

# --- compilation ------------------------------------------------------------
simulation.tasks                | 6  | 1 | cleanup.policy=delete,retention.ms=604800000

# --- simulation -------------------------------------------------------------
simulation.telemetry            | 12 | 1 | cleanup.policy=delete,retention.ms=259200000,max.message.bytes=1048576,compression.type=lz4
simulation.lifecycle            | 3  | 1 | cleanup.policy=delete,retention.ms=604800000

# --- aggregation ------------------------------------------------------------
aggregated.metrics              | 6  | 1 | cleanup.policy=delete,retention.ms=259200000
aggregated.summary              | 3  | 1 | cleanup.policy=delete,retention.ms=604800000

# --- evaluation -------------------------------------------------------------
evaluation.results              | 3  | 1 | cleanup.policy=delete,retention.ms=259200000
evaluation.lifecycle            | 3  | 1 | cleanup.policy=delete,retention.ms=604800000

# --- dead letter queues -----------------------------------------------------
#
# EVERY consumed topic needs one, not just the ones whose producers were obvious when this
# catalogue was first written. Found by running the design service against the live broker:
# a record on evaluation.lifecycle that the service could not read was dead-lettered to
# evaluation.lifecycle.dlt, which did not exist -- and with KAFKA_AUTO_CREATE_TOPICS_ENABLE
# false the send failed with UNKNOWN_TOPIC_OR_PARTITION. The recoverer then retried, the
# retry dead-lettered to the same missing topic, and the partition spun indefinitely:
# "Record in retry and not yet recovered", over and over, forever.
#
# That is strictly worse than losing the record. A DLQ that does not exist does not surface a
# poison message; it hides it and burns a consumer thread doing it. The four below were
# missing because their consumers were written later, which is exactly when a topic's
# importance goes up and nobody goes back to the catalogue.
#
# DLQ retention is 14 days against a source retention of 7, so a DLQ always outlives the
# window in which the same message could legitimately still be replayed from its source.
design.submissions.dlt          | 3  | 1 | retention.ms=1209600000
simulation.tasks.dlt            | 3  | 1 | retention.ms=1209600000
simulation.telemetry.dlt        | 3  | 1 | retention.ms=1209600000
simulation.lifecycle.dlt        | 3  | 1 | retention.ms=1209600000
aggregated.metrics.dlt          | 3  | 1 | retention.ms=1209600000
aggregated.summary.dlt          | 3  | 1 | retention.ms=1209600000
evaluation.results.dlt          | 3  | 1 | retention.ms=1209600000
evaluation.lifecycle.dlt        | 3  | 1 | retention.ms=1209600000
submission.lifecycle.dlt        | 3  | 1 | retention.ms=1209600000
design.updates.dlt              | 3  | 1 | retention.ms=1209600000
