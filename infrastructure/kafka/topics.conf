# ArchForge topic catalogue — single source of truth for `kafka-init`.
#
# Format:  name | partitions | replicationFactor | key=value[,key=value...]
# Blank lines and `#` comments are ignored.
#
# replicationFactor is 1 because the local compose stack runs a single broker.
# Production deployments run 3 brokers; the value below is then raised to 3 by
# infrastructure/kafka/init-topics-prod.sh or by the IaC layer.

# --- design ingestion -------------------------------------------------------
design.submissions              | 6  | 1 | cleanup.policy=delete,retention.ms=604800000
design.updates                  | 6  | 1 | cleanup.policy=compact,delete.retention.ms=86400000,min.cleanable.dirty.ratio=0.1,segment.ms=60000
submission.lifecycle            | 6  | 1 | cleanup.policy=delete,retention.ms=604800000

# --- compilation ------------------------------------------------------------
simulation.tasks                | 6  | 1 | cleanup.policy=delete,retention.ms=604800000

# --- simulation -------------------------------------------------------------
simulation.telemetry            | 12 | 1 | cleanup.policy=delete,retention.ms=259200000,max.message.bytes=1048576,compression.type=lz4
simulation.lifecycle            | 3  | 1 | cleanup.policy=delete,retention.ms=604800000

# --- aggregation ------------------------------------------------------------
