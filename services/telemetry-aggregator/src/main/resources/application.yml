spring:
  application:
    name: telemetry-aggregator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: telemetry-aggregator
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        processing.guarantee: exactly_once_v2

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

telemetry:
  kafka:
    topics:
      simulation-telemetry: simulation.telemetry
      aggregated-metrics: aggregated.metrics
  aggregation:
    window-size-seconds: 10
    window-grace-seconds: 5

logging:
  level:
    com.archforge.telemetry: INFO
